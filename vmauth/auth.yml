users:

  # ============================================================
  # 1. AGENT -> WRITE METRICS
  # ============================================================
  - username: "agent_metrics"
    password: "CHANGE_ME_AGENT_METRICS"
    url_map:
      - src_paths:
          - "/api/v1/write"
          - "/api/v1/import.*"
          - "/write"
        url_prefix: "http://victoriametrics:8428"


  # ============================================================
  # 2. AGENT -> INGEST LOGS
  # ============================================================
  - username: "agent_logs"
    password: "CHANGE_ME_AGENT_LOGS"
    url_map:
      - src_paths:
          - "/insert/.*"
        url_prefix: "http://victorialogs:9428"

  # OTel applications -> VictoriaLogs
  - username: "otel_logs"
    password: "CHANGE_ME_OTEL_LOGS"
    url_map:
      - src_paths:
          - "/insert/opentelemetry/.*"
        url_prefix: "http://victorialogs:9428"

  # ============================================================
  # 3. GRAFANA -> LIVE METRICS
  # ============================================================
  - username: "grafana_live"
    password: "CHANGE_ME_GRAFANA_LIVE"
    url_map:
      - src_paths:
          - "/api/v1/query"
          - "/api/v1/query_range"
          - "/api/v1/series"
          - "/api/v1/labels"
          - "/api/v1/label/.+/values"
          - "/api/v1/metadata"
          - "/api/v1/status/.*"
        url_prefix: "http://victoriametrics:8428"


  # ============================================================
  # 4. GRAFANA -> REPORT METRICS
  # ============================================================
  - username: "grafana_report"
    password: "CHANGE_ME_GRAFANA_REPORT"
    url_map:
      - src_paths:
          - "/api/v1/query"
          - "/api/v1/query_range"
          - "/api/v1/series"
          - "/api/v1/labels"
          - "/api/v1/label/.+/values"
          - "/api/v1/metadata"
          - "/api/v1/status/.*"
        url_prefix: "http://report:8428"


  # ============================================================
  # 5. GRAFANA -> VICTORIALOGS
  # ============================================================
  - username: "grafana_logs"
    password: "CHANGE_ME_GRAFANA_LOGS"
    url_map:
      - src_paths:
          - "/select/.*"
        url_prefix: "http://victorialogs:9428"
  # 6. AGENT VECTOR -> INGEST LOG
  - username: "vector_logs"
    password: "YOUR_VECTOR_LOGS_PASSWORD"
    url_map:
      - src_paths:
          - "/insert/.*"
        url_prefix: "http://victorialogs:9428"
