data_dir: /var/lib/vector

sources:

  application_logs:
    type: file
    include:
      - /var/log/apps/*.log
    read_from: end
  journald:
    type: journald
    current_boot_only: true
  system_metrics:
    type: host_metrics
    scrape_interval_secs: 15
    namespace: "node" # namespace trong prometheus để có thể dùng node_cpu_seconds_total thay vì bắt buộc phải dùng host_cpu_seconds_total
    #optional
    filesystem:
      devices:
        excludes: ["/var/lib/docker/**"]
      mountPoints:
        excludes: ["/var/lib/docker/**"]

transforms:

  normalize_app:
    type: remap
    inputs:
      - application_logs
    source: |
      .service = "application"
      .environment = "lab"


  normalize_journal:
    type: remap
    inputs:
      - journald
    source: |
      .service = "system"
      .environment = "lab"

sinks:

  victorialogs:
    type: http
    inputs:
      - normalize_app
      - normalize_journal

    uri: "http://172.31.9.5:8427/insert/jsonline?_stream_fields=host,source&_msg_field=message"

    method: post

    auth:
      strategy: basic
      user: "vector_logs"
      password: "YOUR_VECTOR_LOGS_PASSWORD"

    encoding:
      codec: json

    framing:
      method: newline_delimited

    compression: gzip

    batch:
      max_bytes: 1000000
      timeout_secs: 2

    healthcheck:
      enabled: false
  victoriametrics:
    type: prometheus_remote_write
    inputs:
      - system_metrics
    endpoint: "http://172.31.4.107:8427/api/v1/write"
    auth:
      strategy: basic
      user: "agent_metrics"
      password: "CHANGE_ME_AGENT_METRICS"
    healthcheck:
      enabled: false